<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${document.id == null ? 'Add Document' : 'Edit Document'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('documents')}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <a class="small text-decoration-none" th:href="@{/documents}"><i class="bi bi-arrow-left"></i> Back to documents</a>
            <h1 class="h3 mt-2 mb-1" th:text="${document.id == null} ? 'Add Document' : 'Edit Document'">Add Document</h1>
            <p class="text-muted">Fields marked with <span class="text-danger">*</span> are required.</p>

            <!-- The same form is used for adding and editing; only the action address differs -->
            <form class="card-soft" method="post" th:object="${document}"
                  th:action="${document.id == null} ? @{/documents} : @{/documents/{id}/update(id=${document.id})}">

                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                    <i class="bi bi-exclamation-octagon-fill"></i> Please fix the highlighted fields below.
                </div>

                <div class="row g-3">
                    <div class="col-md-7">
                        <label class="form-label" for="name">Document name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               th:errorclass="is-invalid" maxlength="100" placeholder="e.g. Car Insurance">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-5">
                        <label class="form-label" for="category">Category <span class="text-danger">*</span></label>
                        <select class="form-select" id="category" th:field="*{category}" th:errorclass="is-invalid">
                            <option value="">Choose a category...</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="documentNumber">Document number <span class="text-muted small">(optional)</span></label>
                        <input type="text" class="form-control" id="documentNumber" th:field="*{documentNumber}"
                               th:errorclass="is-invalid" maxlength="50" placeholder="e.g. POL-2291-884">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('documentNumber')}" th:errors="*{documentNumber}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="issueDate">Issue date <span class="text-muted small">(optional)</span></label>
                        <input type="date" class="form-control" id="issueDate" th:field="*{issueDate}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="expiryDate">Expiry date <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="expiryDate" th:field="*{expiryDate}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="notes">Notes <span class="text-muted small">(optional)</span></label>
                        <textarea class="form-control" id="notes" rows="3" th:field="*{notes}"
                                  th:errorclass="is-invalid" maxlength="500"
                                  placeholder="Where it is kept, who to call to renew, reminders..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a class="btn btn-outline-secondary btn btn-navy" th:href="@{/documents}">Cancel</a>
                    <button type="submit" class="btn btn-navy">
                       
                        <span th:text="${document.id == null} ? 'Save' : 'Update'">Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
