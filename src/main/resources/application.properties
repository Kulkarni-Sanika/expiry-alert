spring.application.name=expiryalert
server.port=8080

# H2 database stored in a file, so your documents survive restarts (folder: ./data)
spring.datasource.url=jdbc:h2:file:./data/expiryalert
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates and updates the table automatically from the entity class
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Optional database viewer at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Templates reload without restart while developing
spring.thymeleaf.cache=false

# Adds a few demo documents on first start (when the table is empty). Set to false for a clean start.
expiryalert.seed-sample-data=true
